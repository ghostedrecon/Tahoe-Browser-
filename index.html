<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somerset TAS Weather</title>
    <meta
      name="description"
      content="Live weather conditions and forecasts for Somerset, Tasmania."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="weather-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Live weather</p>
          <h1>Somerset, TAS</h1>
        </div>
        <div class="status-pill">
          <span class="status-dot"></span>
          Updating live
        </div>
      </header>

      <main class="dashboard" aria-live="polite">
        <section class="current-panel card">
          <div class="current-top">
            <div>
              <p class="label">Current conditions</p>
              <div id="current-time" class="time-stamp">--:--</div>
            </div>
            <div id="weather-icon" class="weather-icon" aria-label="Weather icon">--</div>
          </div>

          <div class="big-temp-wrap">
            <div id="temperature" class="temperature">--°</div>
            <div class="temp-meta">
              <div id="condition" class="condition">Loading...</div>
              <div id="feels-like" class="feels-like">Feels like --°</div>
            </div>
          </div>

          <div class="current-stats">
            <div class="stat-item">
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="stat-item">
              <span>Wind</span>
              <strong id="wind">-- km/h</strong>
            </div>
            <div class="stat-item">
              <span>Pressure</span>
              <strong id="pressure">-- hPa</strong>
            </div>
          </div>
        </section>

        <section class="details-panel card">
          <div class="panel-header">
            <h2>Today</h2>
            <span id="day-summary" class="day-summary">--</span>
          </div>

          <div class="sun-grid">
            <div class="sun-item">
              <span class="sun-label">Sunrise</span>
              <strong id="sunrise">--:--</strong>
            </div>
            <div class="sun-item">
              <span class="sun-label">Sunset</span>
              <strong id="sunset">--:--</strong>
            </div>
          </div>

          <div class="facts-grid">
            <div class="fact-box">
              <span class="fact-label">Visibility</span>
              <strong id="visibility">-- km</strong>
            </div>
            <div class="fact-box">
              <span class="fact-label">Cloud cover</span>
              <strong id="clouds">--%</strong>
            </div>
            <div class="fact-box">
              <span class="fact-label">Rain</span>
              <strong id="rain">-- mm</strong>
            </div>
            <div class="fact-box">
              <span class="fact-label">Min / Max</span>
              <strong id="range">-- / --</strong>
            </div>
          </div>
        </section>

        <section class="forecast-panel card">
          <div class="panel-header">
            <h2>Next 5 days</h2>
          </div>
          <div id="forecast" class="forecast-list"></div>
        </section>

        <section class="hourly-panel card">
          <div class="panel-header">
            <h2>Hourly outlook</h2>
          </div>
          <div id="hourly-forecast" class="hourly-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
